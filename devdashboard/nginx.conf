server {
  listen 80;
  server_name localhost;

  # This is the location of the build output files
  root /usr/share/nginx/html;

  # Redirect the root to the dev dashboard
  location = / {
    return 301 /dev/;
  }

  # This will handle all requests under /dev/, including assets and app routes.
  location /dev/ {
    # We rewrite the URL to remove the /dev/ prefix.
    # E.g. /dev/assets/app.js -> /assets/app.js
    # The 'break' means it will be processed using the new URI within the same server block.
    # Nginx will then use the 'root' directive to find the file.
    rewrite ^/dev/(.*)$ /$1 break;

    # For any request that is not a file, serve index.html. This is for the SPA routing.
    # The URI has been rewritten, so we need to point to /index.html.
    try_files $uri $uri/ /index.html;
  }

  # This location block is for setting cache headers on assets.
  # It will be matched for URIs like /assets/app.css after the rewrite.
  location ~* \.(?:ico|css|js|gif|jpe?g|png|svg)$ {
    expires 1y;
    add_header Cache-Control "public";
  }
} 