name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      # ----------------- API Checks -----------------
      - name: API - Install Dependencies
        run: npm install --prefix api

      - name: API - Run Linter
        run: npm run --prefix api lint

      - name: API - Run Build
        run: npm run --prefix api build

      # ----------------- Dashboard Checks -----------------
      - name: Dashboard - Install Dependencies
        run: npm install --prefix devdashboard

      - name: Dashboard - Run Linter
        run: npm run --prefix devdashboard lint

      - name: Dashboard - Run Build
        run: npm run --prefix devdashboard build

