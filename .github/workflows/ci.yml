name: CI/CD Pipeline

on:
  push:
    branches: ['main', 'dev']
  pull_request:
    branches: ['main', 'dev']

env:
  NODE_VERSION: '20.x'

jobs:
  validate-and-build:
    name: Validation & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # ================== API Pipeline ==================
      - name: API - Install Dependencies
        run: npm install --prefix api

      - name: API - Quality Checks
        run: |
          echo "Running Lint..."
          npm run --prefix api lint:ci
          echo "Running Type Check..."
          npm run --prefix api type-check
          echo "Running Security Audit..."
          npm audit --prefix api --audit-level=high

      - name: API - Build & Test
        run: |
          npm run --prefix api build
          npm run --prefix api test

      # ================== User Dashboard Pipeline ==================
      - name: User Dashboard - Install Dependencies
        run: npm install --prefix user-dashboard

      - name: User Dashboard - Quality Checks
        run: |
          echo "Running Lint..."
          npm run --prefix user-dashboard lint:ci
          echo "Running Type Check..."
          npm run --prefix user-dashboard type-check
          echo "Running Security Audit..."
          npm audit --prefix user-dashboard --audit-level=high --omit=dev

      - name: User Dashboard - Build
        run: npm run --prefix user-dashboard build

      # ================== General Checks ==================
      - name: Project - Security & Quality Scan
        run: |
          echo "Scanning for TODOs..."
          find . -type f \( -name "*.ts" -o -name "*.tsx" -o -name "*.js" -o -name "*.jsx" \) \
            -not -path "*/node_modules/*" \
            -not -path "*/dist/*" \
            -not -path "*/build/*" \
            -exec grep -Hn "TODO\|FIXME" {} \; || true

          echo "Scanning for potential secrets..."
          find . -type f \( -name "*.ts" -o -name "*.tsx" -o -name "*.js" -o -name "*.json" \) \
            -not -path "*/node_modules/*" \
            -not -path "*/dist/*" \
            -not -path "*/build/*" \
            -not -path "*test*" \
            -exec grep -l "password\|secret\|token\|key" {} \; || true
