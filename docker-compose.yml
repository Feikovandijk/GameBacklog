services:
  api:
    image: feikovd/gamebacklog-api:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '6543:6543'
  worker:
    image: feikovd/gamebacklog-api:latest
    restart: unless-stopped
    env_file:
      - .env
    command: ['node', 'dist/scripts/worker.js']
    depends_on:
      - api

  user-dashboard:
    build:
      context: ./user-dashboard
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - api

  dev-dashboard:
    image: feikovd/gamebacklog-devdash:latest
    restart: unless-stopped
    ports:
      - '81:80'
    depends_on:
      - api
# Note: Volume configuration for database is skipped as this setup uses external Supabase.
