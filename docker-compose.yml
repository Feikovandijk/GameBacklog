
services:
  #----------------------------------------------------------------------------------
  # API Service
  #----------------------------------------------------------------------------------
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    # On a PaaS, you would have one service with the "Start Command": npm run start
    # and a separate "Cron Job" service with the command: npm run sync-games
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "6543:6543"
    # In production, the code is baked into the image. This volume is for development.
    # We mount the source code to see changes without rebuilding the image.
    volumes:
      - ./api:/app
      - /app/node_modules

  #----------------------------------------------------------------------------------
  # Worker Service
  # Runs background jobs like syncing player counts.
  #----------------------------------------------------------------------------------
  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    # Override the default CMD ("npm start") to run the worker script
    command: ["node", "dist/scripts/worker.js"]
    volumes:
      - ./api:/app
      - /app/node_modules
    depends_on:
      - api

  #----------------------------------------------------------------------------------
  # User Dashboard Service
  # The main user-facing dashboard.
  #----------------------------------------------------------------------------------
  user-dashboard:
    build:
      context: ./user-dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

  #----------------------------------------------------------------------------------
  # Dev Dashboard Service
  # The developer dashboard.
  #----------------------------------------------------------------------------------
  dashboard:
    build:
      context: ./devdashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Maps the container's port 80 (Nginx) to the host's port 81
      - "81:80"
    depends_on:
      - api # Ensures the API starts before the dashboard.

volumes:
  appwrite_data:
  appwrite_cache: 