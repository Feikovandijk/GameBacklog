services:
  api:
    image: feikovd/gamebacklog-api:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '6543:6543'
  worker:
    image: feikovd/gamebacklog-api:latest
    restart: unless-stopped
    env_file:
      - .env
    command: ['node', 'dist/scripts/worker.js']
    depends_on:
      - api

  user-dashboard:
    image: feikovd/gamebacklog-userdash:latest
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://api:6543
    ports:
      - '80:80'
    depends_on:
      - api

  dev-dashboard:
    image: feikovd/gamebacklog-devdash:latest
    restart: unless-stopped
    ports:
      - '81:80'
    depends_on:
      - api
