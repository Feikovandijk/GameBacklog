<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GameBacklog — DevTracker UI Kit</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Manrope', sans-serif; background: #0B1121; color: #fff; -webkit-font-smoothing: antialiased; }
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.07); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.14); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; line-height: 1; display: inline-flex; align-items: center; justify-content: center; letter-spacing: normal; text-transform: none; white-space: nowrap; word-wrap: normal; direction: ltr; -webkit-font-feature-settings: 'liga'; font-feature-settings: 'liga'; -webkit-font-smoothing: antialiased; }
  * { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  ::selection { background: rgba(0,229,188,0.25); color: #fff; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="Components.jsx"></script>
<script type="text/babel" src="LoginPage.jsx"></script>
<script type="text/babel" src="DashboardPage.jsx"></script>
<script type="text/babel" src="LibraryPage.jsx"></script>
<script type="text/babel" src="KanbanPage.jsx"></script>

<script type="text/babel">
const PAGES = ['dashboard','library','board'];

function App() {
  const stored = (() => { try { return JSON.parse(localStorage.getItem('gb_kit_state') || '{}'); } catch { return {}; } })();
  const [loggedIn, setLoggedIn] = React.useState(stored.loggedIn ?? false);
  const [page, setPage] = React.useState(stored.page ?? 'dashboard');

  React.useEffect(() => {
    localStorage.setItem('gb_kit_state', JSON.stringify({ loggedIn, page }));
  }, [loggedIn, page]);

  if (!loggedIn) {
    return React.createElement(LoginPage, { onLogin: () => setLoggedIn(true) });
  }

  const pageContent = () => {
    if (page === 'dashboard') return React.createElement(DashboardPage, { onNav: setPage });
    if (page === 'library')   return React.createElement(LibraryPage, {});
    if (page === 'board')     return React.createElement(KanbanPage, {});
    // Placeholder pages
    return React.createElement('div', { style:{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', height:400, gap:16 } },
      React.createElement('div', { style:{ width:64, height:64, borderRadius:16, background:'rgba(0,229,188,0.1)', display:'flex', alignItems:'center', justifyContent:'center' } },
        React.createElement(Icon, { name:'construction', size:28, style:{ color:'#00E5BC' } })
      ),
      React.createElement('div', { style:{ fontSize:20, fontWeight:700, color:'#fff' } }, `${page.charAt(0).toUpperCase()+page.slice(1)} page`),
      React.createElement('div', { style:{ fontSize:14, color:'#94A3B8' } }, 'Not included in this UI kit preview'),
      React.createElement('button', {
        onClick: () => setPage('dashboard'),
        style:{ marginTop:8, padding:'9px 18px', borderRadius:12, background:'#161E32', border:'1px solid #2A3550', color:'#fff', fontSize:13, cursor:'pointer', fontFamily:"'Manrope',sans-serif" }
      }, '← Back to Dashboard')
    );
  };

  return React.createElement(AppLayout, { currentPage: page, onNav: setPage, user: 'Feiko' },
    pageContent()
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
