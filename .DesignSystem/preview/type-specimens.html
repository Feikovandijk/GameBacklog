<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Manrope', sans-serif; background: #0B1121; padding: 20px; }
.panel { background: #161E32; border: 1px solid #2A3550; border-radius: 16px; padding: 20px; }
.heading { font-size: 28px; font-weight: 700; color: #fff; letter-spacing: -0.015em; line-height: 1.2; margin-bottom: 4px; }
.sub { font-size: 14px; color: #94A3B8; margin-bottom: 16px; }
.divider { border: none; border-top: 1px solid #2A3550; margin: 12px 0; }
.stat-val { font-size: 30px; font-weight: 700; color: #fff; }
.stat-label { font-size: 13px; color: #94A3B8; font-weight: 500; }
.mono { font-family: 'Courier New', monospace; font-size: 13px; color: #00E5BC; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.flex { display: flex; gap: 24px; align-items: flex-end; }
</style>
</head><body>
<div class="panel">
  <div class="heading">Developer Dashboard</div>
  <div class="sub">Welcome back, Feiko. Here's what's happening in your game ecosystem today.</div>
  <hr class="divider">
  <div class="flex">
    <div><div class="stat-label">Games in Library</div><div class="stat-val">142</div></div>
    <div><div class="stat-label">In Backlog</div><div class="stat-val">67</div></div>
    <div><div class="stat-label">Completed</div><div class="stat-val">31</div></div>
    <div style="margin-left:auto"><span class="mono">$29.99 · 847 players</span></div>
  </div>
</div>
</body></html>
