<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Manrope', sans-serif; background: #0B1121; padding: 20px; }
.row { display: flex; gap: 16px; flex-wrap: wrap; }
.stat-card { background: #161E32; border: 1px solid #2A3550; border-radius: 16px; padding: 20px; display: flex; align-items: center; gap: 16px; min-width: 180px; flex: 1; }
.stat-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.stat-label { font-size: 12px; color: #94A3B8; font-weight: 500; }
.stat-val { font-size: 28px; font-weight: 700; color: #fff; }
.icon { font-family: 'Material Symbols Outlined'; font-size: 24px; }
.label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: #94A3B8; margin-bottom: 10px; margin-top: 16px; }
</style>
</head><body>
<div class="label">Stat Cards</div>
<div class="row">
  <div class="stat-card">
    <div class="stat-icon" style="background:rgba(0,229,188,0.1)"><span class="icon" style="color:#00E5BC">inventory_2</span></div>
    <div><div class="stat-label">Games in Library</div><div class="stat-val">142</div></div>
  </div>
  <div class="stat-card">
    <div class="stat-icon" style="background:rgba(0,163,255,0.1)"><span class="icon" style="color:#00A3FF">bookmark</span></div>
    <div><div class="stat-label">In Backlog</div><div class="stat-val">67</div></div>
  </div>
  <div class="stat-card">
    <div class="stat-icon" style="background:rgba(139,92,246,0.1)"><span class="icon" style="color:#8B5CF6">note_alt</span></div>
    <div><div class="stat-label">Completed Games</div><div class="stat-val">31</div></div>
  </div>
</div>
</body></html>
