<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Manrope', sans-serif; background: #0B1121; padding: 20px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.swatch { border-radius: 12px; overflow: hidden; flex: 1; min-width: 90px; }
.color { height: 72px; }
.info { padding: 8px 10px; background: #161E32; border: 1px solid #2A3550; border-top: none; border-radius: 0 0 12px 12px; }
.name { font-size: 11px; font-weight: 700; color: #fff; }
.hex { font-size: 10px; color: #94A3B8; font-family: monospace; }
.label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: #94A3B8; margin-bottom: 10px; }
</style>
</head><body>
<div class="label">Accent Colors</div>
<div class="row">
  <div class="swatch"><div class="color" style="background:#00A3FF"></div><div class="info"><div class="name">Accent Blue</div><div class="hex">#00A3FF</div></div></div>
  <div class="swatch"><div class="color" style="background:#8B5CF6"></div><div class="info"><div class="name">Accent Purple</div><div class="hex">#8B5CF6</div></div></div>
  <div class="swatch"><div class="color" style="background:#EAB308"></div><div class="info"><div class="name">Accent Yellow</div><div class="hex">#EAB308</div></div></div>
  <div class="swatch"><div class="color" style="background:#4ECB71"></div><div class="info"><div class="name">Accent Green</div><div class="hex">#4ECB71</div></div></div>
  <div class="swatch"><div class="color" style="background:#FFB347"></div><div class="info"><div class="name">Accent Orange</div><div class="hex">#FFB347</div></div></div>
  <div class="swatch"><div class="color" style="background:#10B981"></div><div class="info"><div class="name">Success</div><div class="hex">#10B981</div></div></div>
  <div class="swatch"><div class="color" style="background:#EF4444"></div><div class="info"><div class="name">Error</div><div class="hex">#EF4444</div></div></div>
</div>
</body></html>
