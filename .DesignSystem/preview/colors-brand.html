<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Manrope', sans-serif; background: #0B1121; padding: 20px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.swatch { border-radius: 12px; overflow: hidden; flex: 1; min-width: 90px; }
.color { height: 72px; }
.info { padding: 8px 10px; background: #161E32; border: 1px solid #2A3550; border-top: none; border-radius: 0 0 12px 12px; }
.name { font-size: 11px; font-weight: 700; color: #fff; }
.hex { font-size: 10px; color: #94A3B8; font-family: monospace; }
.label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: #94A3B8; margin-bottom: 10px; }
</style>
</head><body>
<div class="label">Brand Palette</div>
<div class="row">
  <div class="swatch"><div class="color" style="background:#00E5BC"></div><div class="info"><div class="name">Primary</div><div class="hex">#00E5BC</div></div></div>
  <div class="swatch"><div class="color" style="background:#00C4A1"></div><div class="info"><div class="name">Primary Hover</div><div class="hex">#00C4A1</div></div></div>
  <div class="swatch"><div class="color" style="background:#0B1121"></div><div class="info"><div class="name">Background</div><div class="hex">#0B1121</div></div></div>
  <div class="swatch"><div class="color" style="background:#161E32"></div><div class="info"><div class="name">Surface</div><div class="hex">#161E32</div></div></div>
  <div class="swatch"><div class="color" style="background:#1F2943"></div><div class="info"><div class="name">Surface Hover</div><div class="hex">#1F2943</div></div></div>
  <div class="swatch"><div class="color" style="background:#2A3550; border: 1px solid #3a4560"></div><div class="info"><div class="name">Border</div><div class="hex">#2A3550</div></div></div>
  <div class="swatch"><div class="color" style="background:#94A3B8"></div><div class="info"><div class="name">Text Secondary</div><div class="hex">#94A3B8</div></div></div>
</div>
</body></html>
