<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Manrope', sans-serif; background: #0B1121; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: #94A3B8; margin-bottom: 4px; }
.input-wrap { display: flex; align-items: center; gap: 8px; background: #0B1121; border: 1px solid #2A3550; border-radius: 12px; padding: 0 12px; height: 40px; max-width: 320px; }
.input-wrap.focused { border-color: #00E5BC; box-shadow: 0 0 0 1px #00E5BC; }
.icon { font-family: 'Material Symbols Outlined'; font-size: 20px; color: #94A3B8; }
input { background: transparent; border: none; outline: none; color: #fff; font-family: 'Manrope',sans-serif; font-size: 13px; flex: 1; }
input::placeholder { color: #94A3B8; }
select { background: #0B1121; border: 1px solid #2A3550; border-radius: 12px; color: #fff; font-family: 'Manrope',sans-serif; font-size: 13px; padding: 9px 36px 9px 12px; appearance: none; outline: none; max-width: 200px; }
.select-wrap { position: relative; display: inline-block; }
.select-wrap .icon { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); pointer-events: none; }
</style>
</head><body>
<div>
  <div class="label">Search input (default)</div>
  <div class="input-wrap"><span class="icon">search</span><input placeholder="Search games to add..." readonly></div>
</div>
<div>
  <div class="label">Search input (focused)</div>
  <div class="input-wrap focused"><span class="icon" style="color:#00E5BC">search</span><input placeholder="Search library..." value="Elden Ring" readonly></div>
</div>
<div>
  <div class="label">Status filter select</div>
  <div class="select-wrap">
    <select><option>All Statuses</option><option>Playing</option><option>Completed</option><option>Want to Play</option></select>
    <span class="icon">expand_more</span>
  </div>
</div>
</body></html>
